[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens-causal-steering"
version = "0.4.0"
description = "Paired causal steering pilots with Jacobian-lens and contrastive controls"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=5.5",
    "jlens @ git+https://github.com/jinuk0211/visual-jlens.git@021c19beb934dfeaeb1130b2431e39e536a858d3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
# Imports made by the pinned upstream baseline code (submodules in third_party/upstream).
official = [
    "scikit-learn>=1.4",
    "pandas>=2",
    "scipy>=1.11",
    "einops>=0.7",
    "matplotlib>=3.8",
    "rich>=13",
    "tqdm>=4.66",
    "python-dotenv>=1",
    "datasets>=2.19",
    "requests>=2.31",
    "psutil>=5.9",
    "wandb>=0.17",
]

[project.scripts]
jlens-causal = "jlens_causal.cli:main"
jlens-followup = "jlens_causal.followup_cli:main"
agent-steering = "jlens_causal.steering_cli:main"
jlens-failures = "jlens_causal.failure_cli:main"
jlens-official-fit = "jlens_causal.official.fit_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".venv", "outputs"]
