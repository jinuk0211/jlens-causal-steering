[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens-causal-steering"
version = "0.4.0"
description = "Paired causal steering pilots with Jacobian-lens and contrastive controls"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=5.5",
    "jlens @ git+https://github.com/jinuk0211/jacobian-lens.git@021c19beb934dfeaeb1130b2431e39e536a858d3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
jlens-causal = "jlens_causal.cli:main"
jlens-followup = "jlens_causal.followup_cli:main"
agent-steering = "jlens_causal.steering_cli:main"
jlens-failures = "jlens_causal.failure_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
